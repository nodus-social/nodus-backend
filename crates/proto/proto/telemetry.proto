// What a service says about itself, and the log lines it keeps in memory.
//
// The contract is transport neutral on purpose: the same messages travel over a Unix socket
// between containers' neighbours and over TCP between hosts.
syntax = "proto3";

package nodus.telemetry;

service Telemetry {
  rpc GetNodeTelemetry(TelemetryRequest) returns (NodeTelemetry);
  rpc StreamLogs(LogStreamRequest) returns (stream LogEntry);
}

message TelemetryRequest {}

message NodeTelemetry {
  string service_name = 1;
  string binary_version = 2;
  uint64 uptime_seconds = 3;
  double cpu_usage_percent = 4;
  uint64 rss_memory_bytes = 5;
  // Absent for a service that has no queue to report.
  optional uint64 queue_depth = 6;
  Health status = 7;
}

enum Health {
  HEALTH_UNKNOWN = 0;
  HEALTH_HEALTHY = 1;
  HEALTH_DEGRADED = 2;
}

message LogStreamRequest {
  // Replay at most this many buffered entries before following live ones.
  uint32 buffered = 1;
  Level min_level = 2;
}

message LogEntry {
  string timestamp = 1;
  Level level = 2;
  string target = 3;
  string message = 4;
}

enum Level {
  LEVEL_TRACE = 0;
  LEVEL_DEBUG = 1;
  LEVEL_INFO = 2;
  LEVEL_WARN = 3;
  LEVEL_ERROR = 4;
}
