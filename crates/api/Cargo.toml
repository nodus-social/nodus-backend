[package]
name = "nodus-server-api"
description = "Nodus server client API: the Mastodon-compatible HTTP surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ammonia = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
nodus-activitypub-client = { path = "../../../server-sdk/crates/activitypub-client" }
nodus-server-core = { workspace = true }
nodus-server-federation = { workspace = true }
nodus-server-media = { workspace = true }
nodus-server-proto = { path = "../proto" }
nodus-server-runtime = { path = "../runtime" }
nodus-server-scan = { path = "../scan" }
nodus-server-store = { workspace = true }
nodus-server-transport = { path = "../transport" }
nodus-storage = { path = "../storage" }
nodus-shared = { path = "../../../sdk/crates/shared", version = "0.1.0" }
nodus-auth = { workspace = true }
axum-extra = { workspace = true }
leptos = { workspace = true }
nodus-server-sdk = { workspace = true, features = ["nodus", "misskey", "native"] }
rand = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
rsa = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_urlencoded = "0.7"
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
tower-http = { workspace = true }
hyper-util = { version = "0.1", features = ["tokio"] }
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport"] }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
# The insecure-peer test captures the once-per-host warning, the way
# `crates/store/tests/invalidate.rs` captures its once-per-outage one.
tracing-subscriber = { workspace = true }
tower = { workspace = true }
# Secure-mode tests sign with the same `RsaSigner` the outbound client uses, so the
# test cannot pass by agreeing with a reimplementation.
nodus-federation = { path = "../../../server-sdk/crates/federation", features = ["crypto"] }
# The contract tests decode responses into the shipped client's own types, so a field
# this server stops sending fails here instead of in somebody's browser.
nodus-client-core = { path = "../../../sdk/crates/client-core", version = "0.1.0", default-features = false }

[lints]
workspace = true
