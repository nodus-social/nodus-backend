[workspace]
members = ["crates/*", "services/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nodus-social/nodus-backend"

[workspace.dependencies]
anyhow = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots"] }
ammonia = "4"
nodus-server-core = { path = "crates/core" }
nodus-server-store = { path = "crates/store" }
nodus-server-media = { path = "crates/media" }
nodus-server-api = { path = "crates/api" }
nodus-server-feed = { path = "crates/feed" }
nodus-server-federation = { path = "crates/federation" }
nodus-auth = { path = "crates/auth" }
nodus-mail = { path = "crates/mail" }
nodus-server-sdk = { path = "../server-sdk/crates/server", features = ["activitypub", "misskey", "nodus", "native", "federation", "crypto"] }

axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
argon2 = "0.5"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
leptos = { version = "0.8.23", features = ["ssr"] }
rand = "0.9"
redis = { version = "0.32", default-features = false, features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "chrono",
  "json",
  "migrate",
  "macros",
  "uuid",
] }
thiserror = "2"
time = "0.3"
futures-core = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "fs", "io-util", "process"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "limit"] }
tracing = "0.1"
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = "0.26"
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "warn"
items_after_statements = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
